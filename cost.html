<!DOCTYPE html>
<html>
 <title>Sales Cost Computation</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

<h1>Noshitha sales computation</h1>

<form>
<label for="numberItems">Enter number items</label>
<input type="number" id="numberItems" value="1"><br>

<label for="itemCost">Enter the cost of one item</label>
<input type="number" id="itemCost" value="20.0"><br>

<label for="numberForDiscount">Enter number to get discount</label>
<input type="number" id="numberForDiscount" value="10"><br>

<label for="DiscountRate">Enter the discount rate</label>
<input type="number" id="DiscountRate" value="0.15""><br>
</form>
<button onclick="doDiscount()">Show costs</button>

<p id="results"></p>

<script>
  function doDiscount() {
    var number = Number(document.getElementById("numberItems").value);
    var cost = Number(document.getElementById("itemCost").value);
    var discountRate = Number(document.getElementById("DiscountRate").value);
    var discountAt = Number(document.getElementById("numberForDiscount").value);

    var costs = "";

    for (var i = 1; i <= 5; i++) {
      var checkCount = i * number;
      var total;

      if (checkCount <= discountAt) {
        total = checkCount * cost;
      } else {
        total = (discountAt * cost) + ((checkCount - discountAt) * cost * (1 - discountRate));
      }

        costs += "checkCount " + checkCount + " is " + total + "; ";
    }


    document.getElementById("results").innerHTML = "Costs are: " + costs;
  }
</script>
--------

<form>
  <input type="radio" name="op" id="opMul" value="mul" onclick="chooseOp()">
  <label for="opMul">product</label><br>

  <input type="radio" name="op" id="opAdd" value="add" onclick="chooseOp()">
  <label for="opAdd">sum</label><br>

  <input type="radio" name="op" id="opDiv" value="div" onclick="chooseOp()">
  <label for="opDiv">divide</label>
</form>
<p id="opResults"></p>
<script>
function chooseOp() {
  var count = Number(document.getElementById("numberItems").value);
  var discountAt = Number(document.getElementById("numberForDiscount").value);

  var text = "";

 
  if (document.getElementById("opMul").checked) {
    text = count + " times " + discountAt + " is " + (count * discountAt);
  } else if (document.getElementById("opAdd").checked) {
    text = count + " plus " + discountAt + " is " + (count + discountAt);
  } else if (document.getElementById("opDiv").checked) {
    text = count + " divided by " + discountAt + " is " + (count / discountAt);
  }

  document.getElementById("opResults").innerHTML = text;
}
</script>

</body>
</html>
